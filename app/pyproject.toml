[project]
name = "habr-jev-agent"
version = "0.1.0"
description = "Laya + Gemma news agent with a durable SQLite worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.20,<1",
  "httpx[socks]>=0.28,<1",
  "openai>=1.60,<3",
  "PyJWT>=2.10,<3",
  "rapidfuzz>=3.10,<4",
  "nh3>=0.2.20,<1",
  "jinja2>=3.1.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: real models; explicitly enable with RUN_MODEL_INTEGRATION=1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
